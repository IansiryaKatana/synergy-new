<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Synergy Project Management</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      :root {
        color-scheme: light;
        --bg: #0f2540;
        --card: #ffffff;
        --text: #11253a;
        --muted: #5c6a78;
        --brand: #115aa6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at 20% 15%, #1d4f87 0%, var(--bg) 55%);
      }

      main {
        width: min(680px, 100%);
        background: var(--card);
        color: var(--text);
        border: 1px solid #d8e2ee;
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: var(--muted);
      }

      .code {
        margin: 0 0 12px;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--brand);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        color: #ffffff;
        background: var(--brand);
        text-decoration: none;
        font-weight: 600;
      }

      a.alt {
        background: #0f2540;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR 404</p>
      <h1>The page you requested was not found.</h1>
      <p>
        The link may be outdated or unavailable. Use one of the options below to continue exploring Synergy Project
        Management.
      </p>
      <div class="actions">
        <a href="/">Back to homepage</a>
        <a class="alt" href="/contact-us">Contact us</a>
      </div>
    </main>
  </body>
</html>
